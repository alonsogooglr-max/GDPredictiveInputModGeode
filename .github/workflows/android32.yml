name: Smart Click Android32 build

on:
  workflow_dispatch:
  push:
    branches:
      - smart-click-android32-experimental

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android 32-bit Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android32
          sdk: given
          build-config: Release
          export-symbols: true
      - name: Upload experimental package
        uses: actions/upload-artifact@v4
        with:
          name: smart-click-android32-experimental
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
